<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevPocket — privacy-first developer utilities that run entirely in your browser." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>DevPocket — Developer utilities, 100% local</title>
    <script>
      try {
        var t = localStorage.getItem('dp:theme') || '"system"'; t = JSON.parse(t);
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
